apply plugin: 'com.android.application'

android {
    namespace 'com.batman.wleddashboard'
    compileSdkVersion 34

    defaultConfig {
        applicationId "com.batman.wleddashboard"
        minSdkVersion 17
        targetSdkVersion 28
        versionCode 1
        versionName "1.0"
    }

    buildTypes {
        release {
            minifyEnabled false
        }
        debug {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}

dependencies {
    // Pure Android framework (API 17+) for minimal APK size and 100% Jelly Bean 4.2 compatibility
}
