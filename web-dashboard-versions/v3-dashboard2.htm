<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Batman WLED Landscape Dashboard</title>
  <style>
    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: rgba(0,0,0,0);
    }
    body {
      font-family: Arial, sans-serif;
      background-color: #0d0f12;
      color: #e6edf3;
      margin: 0;
      padding: 8px 12px;
      overflow-x: hidden;
      user-select: none;
      -webkit-user-select: none;
    }

    /* Top Utility Bar */
    .top-bar {
      display: table;
      width: 100%;
      margin-bottom: 8px;
    }
    .top-left {
      display: table-cell;
      vertical-align: middle;
      text-align: left;
    }
    .top-right {
      display: table-cell;
      vertical-align: middle;
      text-align: right;
    }
    .schedule-top-btn {
      background: #1c1f24;
      border: 1px solid #f5a623;
      color: #f5a623;
      font-weight: bold;
      padding: 7px 14px;
      border-radius: 6px;
      font-size: 13px;
      cursor: pointer;
    }

    /* 2-Column Landscape Split */
    .dashboard-layout {
      display: table;
      width: 100%;
      table-layout: fixed;
    }
    .col-left {
      display: table-cell;
      width: 46%;
      vertical-align: top;
      padding-right: 8px;
    }
    .col-right {
      display: table-cell;
      width: 54%;
      vertical-align: top;
      padding-left: 8px;
    }

    .card {
      background: #161b22;
      border: 1px solid #30363d;
      border-radius: 8px;
      padding: 10px;
      margin-bottom: 8px;
    }

    /* Large Robo Companion Card */
    .robo-card {
      text-align: center;
      padding: 12px 6px;
    }
    .pulse-animation {
      animation: eyePulse 2.5s infinite ease-in-out;
    }
    @keyframes eyePulse {
      0% { opacity: 0.7; transform: scale(0.96); transform-origin: center; }
      50% { opacity: 1.0; transform: scale(1.04); transform-origin: center; }
      100% { opacity: 0.7; transform: scale(0.96); transform-origin: center; }
    }
    .robo-title {
      font-size: 15px;
      font-weight: bold;
      color: #ffffff;
      margin-top: 6px;
    }
    .robo-status-line {
      font-size: 12px;
      font-weight: bold;
      margin-top: 2px;
    }

    /* Recite Schedule Button */
    .speech-box {
      margin-top: 10px;
      background: #0d1117;
      border: 1px solid #30363d;
      border-radius: 6px;
      padding: 8px;
      text-align: left;
    }
    .speech-bubble {
      font-size: 12px;
      color: #8b949e;
      min-height: 30px;
    }
    .recite-btn {
      width: 100%;
      margin-top: 6px;
      background: #21262d;
      border: 1px solid #388bfd;
      color: #58a6ff;
      padding: 8px;
      font-weight: bold;
      font-size: 12px;
      border-radius: 5px;
      cursor: pointer;
    }

    /* Right Panel Controls */
    button {
      background: #21262d;
      border: 1px solid #363b42;
      color: #ffffff;
      padding: 8px;
      border-radius: 6px;
      font-size: 13px;
      cursor: pointer;
    }
    .power-btn {
      width: 100%;
      padding: 12px;
      font-size: 15px;
      font-weight: bold;
      background: #21262d;
      border-radius: 6px;
    }
    .power-btn.on {
      background: #195b28;
      border-color: #2ea043;
    }

    /* Sliders & Rows */
    .row {
      display: table;
      width: 100%;
      margin-bottom: 4px;
    }
    .row-left { display: table-cell; text-align: left; vertical-align: middle; }
    .row-right { display: table-cell; text-align: right; vertical-align: middle; }
    input[type=range] {
      width: 100%;
      margin: 6px 0;
    }

    /* Tabs */
    .tabs {
      background: #0d1117;
      padding: 2px;
      border-radius: 6px;
      border: 1px solid #30363d;
      margin-bottom: 8px;
      display: table;
      width: 100%;
      box-sizing: border-box;
    }
    .tabs button {
      display: table-cell;
      width: 50%;
      background: transparent;
      border: none;
      color: #8b949e;
      padding: 6px 0;
    }
    .tabs button.active {
      background: #21262d;
      color: #ffffff;
      border-radius: 4px;
    }
    .tab-content { display: none; }
    .tab-content.active { display: block; }

    /* Color Wheel & Swatches Section */
    .picker-split {
      display: table;
      width: 100%;
    }
    .picker-col-left {
      display: table-cell;
      width: 48%;
      vertical-align: middle;
      text-align: center;
    }
    .picker-col-right {
      display: table-cell;
      width: 52%;
      vertical-align: middle;
      padding-left: 8px;
    }
    .swatch-table {
      width: 100%;
      border-collapse: separate;
      border-spacing: 4px;
    }
    .color-swatch {
      height: 32px;
      border-radius: 5px;
      cursor: pointer;
      border: 1px solid #444;
    }
    canvas {
      border-radius: 50%;
      cursor: pointer;
      display: block;
      margin: 0 auto;
    }
    .color-preview {
      width: 80%;
      height: 10px;
      border-radius: 3px;
      margin: 4px auto 0 auto;
      border: 1px solid rgba(255,255,255,0.2);
    }

    .preset-table {
      width: 100%;
      border-collapse: separate;
      border-spacing: 5px;
    }
    .preset-table button { width: 100%; padding: 8px 4px; }

    .status-text {
      font-size: 11px;
      color: #8b949e;
      text-align: center;
    }

    /* Timetable Modal */
    .modal-overlay {
      display: none;
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0,0,0,0.85);
      z-index: 100;
    }
    .modal-overlay.open { display: block; }
    .modal-content {
      position: absolute;
      top: 5%; left: 5%; width: 90%; height: 90%;
      background: #161b22;
      border: 1px solid #30363d;
      border-radius: 8px;
      padding: 12px;
      box-sizing: border-box;
      overflow-y: auto;
    }
    .day-selector {
      display: table;
      width: 100%;
      margin: 8px 0;
    }
    .day-selector button {
      display: table-cell;
      padding: 6px;
      font-size: 12px;
    }
    .day-selector button.active {
      background: #f5a623;
      color: #000;
      font-weight: bold;
    }
    .period-item {
      background: #0d1117;
      padding: 6px 10px;
      border-radius: 4px;
      margin-bottom: 5px;
      display: table;
      width: 100%;
      box-sizing: border-box;
    }
    .period-left { display: table-cell; vertical-align: middle; }
    .period-right { display: table-cell; text-align: right; vertical-align: middle; width: 80px; }
    .period-time { font-size: 11px; color: #8b949e; }
    .period-title { font-size: 12px; font-weight: bold; margin-top: 1px; }
    .period-tag {
      font-size: 10px;
      font-weight: bold;
      padding: 2px 6px;
      border-radius: 3px;
      color: #ffffff;
      display: inline-block;
    }
    .tag-lecture { background: #2ea043; }
    .tag-practical { background: #d29922; color: #000000; }
    .tag-tutorial { background: #a371f7; }
  </style>
</head>
<body>

<!-- Utility Top Row -->
<div class="top-bar">
  <div class="top-left">
    <button class="schedule-top-btn" onclick="openSchedule()">[=] View Timetable</button>
  </div>
  <div class="top-right">
    <span style="font-size:12px; font-weight:bold;">Patiala • Punjab</span>
    <span style="font-size:11px; color:#8b949e; margin-left:4px;">Desk Display</span>
  </div>
</div>

<!-- Main Split Screen -->
<div class="dashboard-layout">
  
  <!-- LEFT COLUMN: Mascot & Speech Recital -->
  <div class="col-left">
    <div class="card robo-card">
      <!-- Large Scaled SVG Mascot -->
      <svg id="robo-face" width="130" height="110" viewBox="0 0 44 40" fill="none" xmlns="http://www.w3.org/2000/svg">
        <rect x="2" y="6" width="40" height="30" rx="6" fill="#21262d" stroke="#30363d" stroke-width="2"/>
        <rect x="18" y="2" width="8" height="4" fill="#8b949e"/>
        <circle cx="22" cy="1" r="1.5" fill="#f5a623"/>
        <path d="M5 36 H39" stroke="#30363d" stroke-width="2"/>
        <path d="M12 36 L16 39" stroke="#30363d" stroke-width="2"/>
        <path d="M32 36 L28 39" stroke="#30363d" stroke-width="2"/>
        <!-- Eyes -->
        <circle id="robo-eye-l" class="pulse-animation" cx="14" cy="20" r="4.8" fill="#ff9900" style="transition: fill 0.25s ease;"/>
        <circle id="robo-eye-r" class="pulse-animation" cx="30" cy="20" r="4.8" fill="#ff9900" style="transition: fill 0.25s ease;"/>
        <!-- Mouth -->
        <path id="robo-mouth" d="M18 28 Q22 31 26 28" stroke="#ffffff" stroke-width="2" stroke-linecap="round"/>
      </svg>
      <div class="robo-title">Robo Companion</div>
      <div id="roboStatus" class="robo-status-line" style="color:#ff9900;">Status: Sleeping...</div>

      <!-- Schedule Reciter Block -->
      <div class="speech-box">
        <div id="speechText" class="speech-bubble">Tap below to check your closest class.</div>
        <button class="recite-btn" onclick="reciteClosestSchedule()">[Speak] Recite Upcoming Class</button>
      </div>
    </div>
  </div>

  <!-- RIGHT COLUMN: Lighting Controls -->
  <div class="col-right">
    <div class="card">
      <button id="toggleBtn" class="power-btn" onclick="togglePower()">Power: Connecting...</button>
    </div>

    <div class="card">
      <div class="row">
        <div class="row-left"><span style="font-size:12px; font-weight:bold;">Brightness</span></div>
        <div class="row-right"><span id="briVal" style="font-size:12px;">--</span></div>
      </div>
      <input type="range" id="briSlider" min="1" max="255" value="128" onchange="setBrightness(this.value)">
    </div>

    <div class="tabs">
      <button id="tabBtnColors" class="active" onclick="switchTab('colors')">Palette & Colors</button>
      <button id="tabBtnPresets" onclick="switchTab('presets')">Presets Tab</button>
    </div>

    <div class="card tab-content active" id="tabColors">
      <div class="picker-split">
        <div class="picker-col-left">
          <canvas id="colorWheel" width="108" height="108"></canvas>
          <div id="colorPreview" class="color-preview" style="background:#ff9900"></div>
        </div>
        <div class="picker-col-right">
          <table class="swatch-table">
            <tr>
              <td class="color-swatch" style="background:#ff9900" onclick="setFastColor([255,153,0])"></td>
              <td class="color-swatch" style="background:#ff3300" onclick="setFastColor([255,51,0])"></td>
              <td class="color-swatch" style="background:#ffffff" onclick="setFastColor([255,255,255])"></td>
            </tr>
            <tr>
              <td class="color-swatch" style="background:#0077ff" onclick="setFastColor([0,119,255])"></td>
              <td class="color-swatch" style="background:#8800ff" onclick="setFastColor([136,0,255])"></td>
              <td class="color-swatch" style="background:#00f2fe" onclick="setFastColor([0,242,254])"></td>
            </tr>
          </table>
        </div>
      </div>
    </div>

    <div class="card tab-content" id="tabPresets">
      <table class="preset-table">
        <tr>
          <td><button onclick="setPreset(1)">P 1</button></td>
          <td><button onclick="setPreset(2)">P 2</button></td>
          <td><button onclick="setPreset(3)">P 3</button></td>
          <td><button onclick="setPreset(4)">P 4</button></td>
        </tr>
        <tr>
          <td><button onclick="setPreset(5)">P 5</button></td>
          <td><button onclick="setPreset(6)">P 6</button></td>
          <td><button onclick="setPreset(7)">P 7</button></td>
          <td><button onclick="setPreset(8)">P 8</button></td>
        </tr>
      </table>
    </div>

    <div class="status-text" id="status">Syncing with WLED...</div>
  </div>

</div>

<!-- Modal Timetable Drawer -->
<div class="modal-overlay" id="scheduleModal" onclick="closeSchedule(event)">
  <div class="modal-content" onclick="stopProp(event)">
    <div class="row">
      <div class="row-left"><span style="font-size:14px; font-weight:bold;">Full Academic Timetable</span></div>
      <div class="row-right"><button onclick="closeScheduleDirect()" style="padding:4px 10px;">X</button></div>
    </div>
    <div class="day-selector">
      <button id="dayBtn1" onclick="showDay(1)">Mon</button>
      <button id="dayBtn2" onclick="showDay(2)">Tue</button>
      <button id="dayBtn3" onclick="showDay(3)">Wed</button>
      <button id="dayBtn4" onclick="showDay(4)">Thu</button>
      <button id="dayBtn5" onclick="showDay(5)">Fri</button>
    </div>
    <div id="scheduleDisplay"></div>
  </div>
</div>

<script>
  var API_URL = '/json/state';
  var isPoweredOn = false;

  var TIMETABLE = {
    1: [
      { start: 530, time: '08:50 AM - 09:40 AM', name: 'Industrial Instrumentation (E102)', type: 'Lecture' },
      { start: 580, time: '09:40 AM - 10:30 AM', name: 'Bio-Medical Instrumentation Lab', type: 'Practical' },
      { start: 630, time: '10:30 AM - 11:20 AM', name: 'Bio-Medical Instrumentation Lab', type: 'Practical' },
      { start: 680, time: '11:20 AM - 12:10 PM', name: 'Process Dynamics and Control Lab', type: 'Practical' },
      { start: 730, time: '12:10 PM - 01:00 PM', name: 'Process Dynamics and Control Lab', type: 'Practical' },
      { start: 885, time: '02:45 PM - 03:30 PM', name: 'Industrial Instrumentation (I304)', type: 'Tutorial' },
      { start: 930, time: '03:30 PM - 04:20 PM', name: 'Bio-Medical Instrumentation (E103)', type: 'Lecture' },
      { start: 980, time: '04:20 PM - 05:10 PM', name: 'UEIXXX (E101)', type: 'Lecture' }
    ],
    2: [
      { start: 480, time: '08:00 AM - 08:50 AM', name: 'Process Dynamics and Control (E102)', type: 'Lecture' },
      { start: 530, time: '08:50 AM - 09:40 AM', name: 'Network Analysis (E102)', type: 'Lecture' },
      { start: 580, time: '09:40 AM - 10:30 AM', name: 'Bio-Medical Instrumentation', type: 'Lecture' },
      { start: 630, time: '10:30 AM - 11:20 AM', name: 'UEIXXX (E102)', type: 'Tutorial' },
      { start: 680, time: '11:20 AM - 12:10 PM', name: 'Industrial Instrumentation (E102)', type: 'Lecture' },
      { start: 835, time: '01:55 PM - 02:45 PM', name: 'UEIXXX Lab', type: 'Practical' },
      { start: 885, time: '02:45 PM - 03:35 PM', name: 'UEIXXX Lab', type: 'Practical' }
    ],
    3: [
      { start: 580, time: '09:40 AM - 10:30 AM', name: 'Industrial Instrumentation Lab', type: 'Practical' },
      { start: 630, time: '10:30 AM - 11:20 AM', name: 'Industrial Instrumentation Lab', type: 'Practical' },
      { start: 835, time: '01:55 PM - 02:45 PM', name: 'UEIXXX (E102)', type: 'Lecture' },
      { start: 885, time: '02:45 PM - 03:35 PM', name: 'UEIXXX (E102)', type: 'Lecture' },
      { start: 930, time: '03:30 PM - 04:20 PM', name: 'Network Analysis (E102)', type: 'Lecture' },
      { start: 980, time: '04:20 PM - 05:10 PM', name: 'Process Dynamics and Control (E102)', type: 'Lecture' }
    ],
    4: [
      { start: 580, time: '09:40 AM - 10:30 AM', name: 'Network Analysis (F315)', type: 'Tutorial' },
      { start: 630, time: '10:30 AM - 11:20 AM', name: 'Process Dynamics and Control (F315)', type: 'Tutorial' },
      { start: 680, time: '11:20 AM - 12:10 PM', name: 'Innovation and Entrepreneurship (E102)', type: 'Lecture' },
      { start: 835, time: '01:55 PM - 02:45 PM', name: 'UEIXXX Lab', type: 'Practical' },
      { start: 885, time: '02:45 PM - 03:35 PM', name: 'UEIXXX Lab', type: 'Practical' },
      { start: 930, time: '03:30 PM - 04:20 PM', name: 'Innovation and Entrepreneurship Lab', type: 'Practical' },
      { start: 980, time: '04:20 PM - 05:10 PM', name: 'Innovation and Entrepreneurship Lab', type: 'Practical' }
    ],
    5: [
      { start: 530, time: '08:50 AM - 09:40 AM', name: 'UEIXXX (E102)', type: 'Tutorial' },
      { start: 580, time: '09:40 AM - 10:30 AM', name: 'Industrial Instrumentation (E102)', type: 'Lecture' },
      { start: 630, time: '10:30 AM - 11:20 AM', name: 'Bio-Medical Instrumentation (E102)', type: 'Lecture' },
      { start: 680, time: '11:20 AM - 12:10 PM', name: 'UEIXXX (E102)', type: 'Lecture' },
      { start: 730, time: '12:10 PM - 01:00 PM', name: 'Process Dynamics and Control (E102)', type: 'Lecture' }
    ]
  };

  /* Safe Schedule Recitation Engine */
  function reciteClosestSchedule() {
    var now = new Date();
    var day = now.getDay();
    var mins = (now.getHours() * 60) + now.getMinutes();
    var bubble = document.getElementById('speechText');

    if (day < 1 || day > 5) {
      var msg = "It is the weekend! No scheduled classes today.";
      bubble.innerHTML = msg;
      safeSpeak(msg);
      return;
    }

    var list = TIMETABLE[day] || [];
    var upcoming = null;
    for (var i = 0; i < list.length; i++) {
      if (list[i].start >= mins) {
        upcoming = list[i];
        break;
      }
    }

    if (upcoming) {
      var text = "Next up at " + upcoming.time + ": " + upcoming.name;
      bubble.innerHTML = text;
      safeSpeak(text);
    } else {
      var doneMsg = "Classes are completed for today!";
      bubble.innerHTML = doneMsg;
      safeSpeak(doneMsg);
    }
  }

  function safeSpeak(text) {
    try {
      if (window.speechSynthesis && window.SpeechSynthesisUtterance) {
        window.speechSynthesis.cancel();
        var u = new SpeechSynthesisUtterance(text);
        u.rate = 0.95;
        window.speechSynthesis.speak(u);
      }
    } catch(err) {}
  }

  /* Modal Logic */
  function stopProp(e) {
    if (e.stopPropagation) e.stopPropagation();
    else e.cancelBubble = true;
  }
  function openSchedule() {
    document.getElementById('scheduleModal').className = 'modal-overlay open';
    var d = new Date().getDay();
    showDay(d >= 1 && d <= 5 ? d : 1);
  }
  function closeScheduleDirect() {
    document.getElementById('scheduleModal').className = 'modal-overlay';
  }
  function closeSchedule(e) {
    if (e.target.id === 'scheduleModal') closeScheduleDirect();
  }
  function showDay(dayNum) {
    for (var i = 1; i <= 5; i++) {
      document.getElementById('dayBtn' + i).className = (i === dayNum) ? 'active' : '';
    }
    var container = document.getElementById('scheduleDisplay');
    container.innerHTML = '';
    var list = TIMETABLE[dayNum] || [];
    for (var j = 0; j < list.length; j++) {
      var p = list[j];
      var tagClass = p.type === 'Lecture' ? 'tag-lecture' : p.type === 'Practical' ? 'tag-practical' : 'tag-tutorial';
      container.innerHTML += '<div class="period-item">' +
        '<div class="period-left">' +
          '<div class="period-time">' + p.time + '</div>' +
          '<div class="period-title">' + p.name + '</div>' +
        '</div>' +
        '<div class="period-right">' +
          '<span class="period-tag ' + tagClass + '">' + p.type + '</span>' +
        '</div>' +
      '</div>';
    }
  }

  /* Tab Navigation */
  function switchTab(tab) {
    document.getElementById('tabColors').className = 'card tab-content' + (tab === 'colors' ? ' active' : '');
    document.getElementById('tabPresets').className = 'card tab-content' + (tab === 'presets' ? ' active' : '');
    document.getElementById('tabBtnColors').className = (tab === 'colors' ? 'active' : '');
    document.getElementById('tabBtnPresets').className = (tab === 'presets' ? 'active' : '');
  }

  /* Legacy ES5 XHR */
  function xhrRequest(method, url, data, callback) {
    var xhr = new XMLHttpRequest();
    xhr.open(method, url, true);
    xhr.setRequestHeader('Content-Type', 'application/json');
    xhr.onreadystatechange = function() {
      if (xhr.readyState === 4) {
        if (xhr.status === 200 && callback) {
          try {
            var json = JSON.parse(xhr.responseText);
            callback(json);
          } catch(e) {}
        }
      }
    };
    xhr.send(data ? JSON.stringify(data) : null);
  }

  function fetchState() {
    xhrRequest('GET', API_URL, null, function(data) {
      isPoweredOn = data.on;
      updateUI(data);
    });
  }

  function updateUI(data) {
    var btn = document.getElementById('toggleBtn');
    btn.innerHTML = data.on ? 'Turn Off Logo' : 'Turn On Logo';
    btn.className = 'power-btn' + (data.on ? ' on' : '');
    document.getElementById('briSlider').value = data.bri;
    document.getElementById('briVal').innerHTML = Math.round((data.bri / 255) * 100) + '%';
    document.getElementById('status').innerHTML = 'WLED Connected';
    
    var rStatus = document.getElementById('roboStatus');
    var rEyeL = document.getElementById('robo-eye-l');
    var rEyeR = document.getElementById('robo-eye-r');
    var rMouth = document.getElementById('robo-mouth');
    
    if (data.on) {
      rStatus.innerHTML = 'Status: Awake!';
      rStatus.style.color = '#2ea043';
      rMouth.setAttribute('d', 'M16 28 Q22 32 28 28');
      
      try {
        var rgb = data.seg[0].col[0];
        if (rgb) {
          var rgbStr = 'rgb(' + rgb[0] + ',' + rgb[1] + ',' + rgb[2] + ')';
          rEyeL.setAttribute('fill', rgbStr);
          rEyeR.setAttribute('fill', rgbStr);
          document.getElementById('colorPreview').style.backgroundColor = rgbStr;
        }
      } catch (e) {}
    } else {
      rStatus.innerHTML = 'Status: Asleep...';
      rStatus.style.color = '#8b949e';
      rEyeL.setAttribute('fill', '#444c56');
      rEyeR.setAttribute('fill', '#444c56');
      rMouth.setAttribute('d', 'M18 30 H26');
    }
  }

  function togglePower() {
    xhrRequest('POST', API_URL, { on: !isPoweredOn }, updateUI);
  }

  function setBrightness(val) {
    document.getElementById('briVal').innerHTML = Math.round((val / 255) * 100) + '%';
    xhrRequest('POST', API_URL, { bri: parseInt(val) }, updateUI);
  }

  function setColor(rgb) {
    xhrRequest('POST', API_URL, { seg: [{ col: [rgb] }] }, updateUI);
  }

  function setFastColor(rgb) {
    var rgbStr = 'rgb(' + rgb[0] + ',' + rgb[1] + ',' + rgb[2] + ')';
    document.getElementById('colorPreview').style.backgroundColor = rgbStr;
    if (isPoweredOn) {
      document.getElementById('robo-eye-l').setAttribute('fill', rgbStr);
      document.getElementById('robo-eye-r').setAttribute('fill', rgbStr);
    }
    setColor(rgb);
  }

  function setPreset(id) {
    xhrRequest('POST', API_URL, { ps: parseInt(id) }, updateUI);
  }

  /* Pre-rendered Canvas Color Ring */
  var canvas = document.getElementById('colorWheel');
  var ctx = canvas.getContext('2d');
  var radius = canvas.width / 2;

  function drawWheel() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    var wedges = 12;
    for (var i = 0; i < wedges; i++) {
      var angleStart = (i * 2 * Math.PI) / wedges;
      var angleEnd = ((i + 1) * 2 * Math.PI) / wedges;
      ctx.beginPath();
      ctx.moveTo(radius, radius);
      ctx.arc(radius, radius, radius, angleStart, angleEnd);
      ctx.closePath();
      var hue = (i * 360) / wedges;
      ctx.fillStyle = 'hsl(' + hue + ', 100%, 50%)';
      ctx.fill();
    }
    var gradient = ctx.createRadialGradient(radius, radius, 0, radius, radius, radius);
    gradient.addColorStop(0, 'rgba(255, 255, 255, 1)');
    gradient.addColorStop(0.3, 'rgba(255, 255, 255, 0.8)');
    gradient.addColorStop(1, 'rgba(255, 255, 255, 0)');
    ctx.beginPath();
    ctx.arc(radius, radius, radius, 0, 2 * Math.PI);
    ctx.fillStyle = gradient;
    ctx.fill();
  }

  var sendTimeout = null;
  function getTouchPos(e) {
    var rect = canvas.getBoundingClientRect();
    var x = e.clientX || (e.touches && e.touches[0] ? e.touches[0].clientX : 0);
    var y = e.clientY || (e.touches && e.touches[0] ? e.touches[0].clientY : 0);
    return {
      x: (x - rect.left) * (canvas.width / rect.width),
      y: (y - rect.top) * (canvas.height / rect.height)
    };
  }

  function pickColor(e) {
    if (e.touches) e.preventDefault();
    var pos = getTouchPos(e);
    var pixel = ctx.getImageData(pos.x, pos.y, 1, 1).data;
    if (pixel[3] > 0) {
      var rgb = [pixel[0], pixel[1], pixel[2]];
      var rgbStr = 'rgb(' + rgb[0] + ',' + rgb[1] + ',' + rgb[2] + ')';
      document.getElementById('colorPreview').style.backgroundColor = rgbStr;
      if (isPoweredOn) {
        document.getElementById('robo-eye-l').setAttribute('fill', rgbStr);
        document.getElementById('robo-eye-r').setAttribute('fill', rgbStr);
      }
      clearTimeout(sendTimeout);
      sendTimeout = setTimeout(function() {
        setColor(rgb);
      }, 80);
    }
  }

  canvas.addEventListener('click', pickColor);
  canvas.addEventListener('touchmove', pickColor);
  canvas.addEventListener('touchstart', pickColor);

  drawWheel();
  fetchState();
  setInterval(fetchState, 4000);
</script>

</body>
